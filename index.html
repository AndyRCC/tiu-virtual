<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8FE">
  <title>TIU UPC – Prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8F8FE;
      --pill: #DEDCFB;
      --ink: #141418;
      --muted: #5E6672;
      --slate: #48505C;
      --red: #CC3A41;
      --cloud: #C9CBFA;
      --photo: #D3D3D3;
      --card: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Pantalla del celular: ocupa todo en móvil, se muestra como teléfono en escritorio */
    .screen {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      container-type: size;
    }

    /* En escritorio se dibuja un iPhone 13 Pro (390×844) y se escala entero para caber en la ventana */
    @media (min-width: 600px) {
      body {
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #EEEDFB 0%, #DCDBEE 100%);
      }
      .screen {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 390px;
        height: 844px;
        border-radius: 46px;
        transform: translate(-50%, -50%) scale(var(--fit, 1));
        box-shadow:
          0 0 0 10px #1C1C22,
          0 40px 80px -24px rgba(36, 32, 90, 0.45);
      }
    }

    /* ---------- Barra de estado y barra de inicio del iPhone (solo en el mockup de escritorio;
                  en el celular real ya las pone el sistema) ---------- */
    .statusbar, .homebar { display: none; }

    @media (min-width: 600px) {
      .statusbar {
        position: relative;
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        height: 47px;
        color: #000000;
      }

      .sb-side {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: calc(50% - 81px);
        padding-top: 2px;
      }

      .sb-time {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }

      .sb-side svg { display: block; height: 11px; width: auto; fill: currentColor; }
      .sb-side svg.battery { height: 12px; }

      .sb-notch {
        position: absolute;
        top: 0;
        left: 50%;
        width: 162px;
        height: 32px;
        transform: translateX(-50%);
        border-radius: 0 0 20px 20px;
        background: #1C1C22;
      }

      .homebar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        z-index: 5;
        display: block;
        width: 134px;
        height: 5px;
        transform: translateX(-50%);
        border-radius: 3px;
        background: #111114;
      }
    }

    /* ---------- Barra superior: botón de regresar y título ---------- */
    .topbar {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: max(12px, env(safe-area-inset-top)) 18px 0;
    }

    .back {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 10px rgba(70, 66, 140, 0.12);
      cursor: pointer;
      transition: background-color 0.15s, transform 0.15s;
    }

    .back:hover { background: #F1F0FD; }
    .back:active { transform: scale(0.94); }
    .back:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    .back svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--red);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topbar-title {
      font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
      font-weight: 600;
      font-size: 23px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #121216;
    }

    /* ---------- Parte superior: hora, fecha, foto y nubes ---------- */
    .sky {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2.8cqh;
    }

    .clock {
      width: 62%;
      padding: 1.6cqh 0;
      border-radius: 16px;
      background: var(--pill);
      text-align: center;
      font-size: min(11.5cqw, 5.6cqh);
      font-weight: 400;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .date {
      margin-top: 2.6cqh;
      font-size: min(4.4cqw, 2.1cqh);
      font-weight: 500;
      color: var(--muted);
    }

    .stage {
      --photo: min(44cqw, 22cqh);
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 3cqh;
    }

    .photo {
      position: relative;
      z-index: 2;
      width: var(--photo);
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #FFFFFF;
      background: var(--photo-bg, #D3D3D3);
      box-shadow:
        0 0 0 2px var(--pill),
        0 12px 26px -10px rgba(70, 66, 140, 0.35);
    }

    /* Nubes: cruzan la pantalla de izquierda a derecha y vuelven a entrar */
    .clouds {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* --dy desplaza la nube respecto al borde inferior de la foto */
    .cloud {
      position: absolute;
      left: 0;
      bottom: calc(50% + 1.5cqh - var(--photo) / 2 + var(--dy));
      width: var(--w);
      opacity: var(--o, 1);
      animation: drift var(--t) linear infinite;
      animation-delay: calc(var(--p) * var(--t) * -1);
    }

    .cloud svg { display: block; width: 100%; height: auto; fill: var(--cloud); }
    .cloud.flip svg { transform: scaleX(-1); }

    @keyframes drift {
      from { left: 0;    transform: translateX(-100%); }
      to   { left: 100%; transform: translateX(0); }
    }

    /* ---------- Tarjeta inferior con los datos del alumno ---------- */
    .card {
      position: relative;
      z-index: 3;
      margin: 0 6px;
      padding: 3.4cqh 20px max(3.6cqh, env(safe-area-inset-bottom));
      border-radius: 22px 22px 0 0;
      background: var(--card);
      box-shadow: 0 -8px 28px rgba(70, 66, 140, 0.07);
      text-align: center;
    }

    .name {
      font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
      font-weight: 600;
      font-size: min(10.4cqw, 4.9cqh);
      line-height: 1.04;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--red);
    }

    .field { margin-top: 1.7cqh; }
    .field + .field { margin-top: 1.5cqh; }

    .label {
      font-size: min(4.2cqw, 2cqh);
      font-weight: 500;
      color: #33383F;
    }

    .value {
      font-size: min(4.7cqw, 2.25cqh);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--slate);
    }

    .career {
      margin-top: 2.6cqh;
      font-size: min(4.9cqw, 2.35cqh);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--slate);
    }

    .campus {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 1.4cqh;
      font-size: min(4.2cqw, 2cqh);
      font-weight: 500;
      color: #33383F;
    }

    .campus svg { width: 0.85em; height: auto; fill: var(--red); }
  </style>
</head>

  <script>
    const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sept', 'Oct', 'Nov', 'Dic'];

    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const statusTimeEl = document.getElementById('sb-time');
    const pad = n => String(n).padStart(2, '0');

    function render() {
      const now = new Date();
      clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      statusTimeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      clockEl.dateTime = now.toISOString();
      dateEl.textContent = `${DIAS[now.getDay()]}, ${pad(now.getDate())} ${MESES[now.getMonth()]} ${now.getFullYear()}`;
    }

    // Se reprograma al inicio de cada segundo para que la hora no se desfase
    function tick() {
      render();
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }

    tick();

    // En escritorio: escala del teléfono según el tamaño de la ventana (marco incluido: 410×864)
    const screenEl = document.querySelector('.screen');

    function fit() {
      const k = Math.min((innerHeight - 56) / 864, (innerWidth - 56) / 410, 1.25);
      screenEl.style.setProperty('--fit', k.toFixed(3));
    }

    addEventListener('resize', fit);
    fit();
  </script>
